# DNS off: avoids the port 53 conflict 
port=0

# Only serve on the PXE adapter 
interface=enp0s2
bind-interfaces

# Proxy mode: macOS hands out IPs, we only add boot info
dhcp-range=192.168.128.0,proxy
log-dhcp

# TFTP server 
enable-tftp
tftp-root=/srv/tftp

# Clients already running iPXE get tagged 
dhcp-userclass=set:ipxe,iPXE

# Round 1: firmware (not iPXE yet) gets the iPXE binary

pxe-service=tag:!ipxe,ARM64_EFI,"iPXE ARM64",ipxe-arm64.efi

# Round 2: iPXE gets the script, which breaks the loop

dhcp-boot=tag:ipxe,boot.ipxe
